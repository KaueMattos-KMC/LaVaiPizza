name: lavaipizza_app
description: App mobile da pizzaria LaVaiPizza (PIM IV) - cardápio, carrinho, pedido e acompanhamento.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  material_ui: 1.11.0
  provider: 6.1.5+1
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  # Fotos do cardápio e logo (cópias reduzidas das imagens do site)
  assets:
    - assets/images/
